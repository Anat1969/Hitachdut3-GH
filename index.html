<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>יומן ביקורי אתר</title>
<style>
  :root {
    --bg: #f6f5f2;
    --card: #ffffff;
    --text: #1d1d1b;
    --muted: #6b6b66;
    --line: #dddcd6;
    --navy: #1f3a5f;
    --open: #c96a12;
    --open-bg: #fdf0e3;
    --closed: #7a7a75;
    --closed-bg: #ececea;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
    font-size: 17px;
    line-height: 1.5;
    direction: rtl;
    text-align: right;
  }
  main { max-width: 640px; margin: 0 auto; padding: 16px; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
  h1 { margin: 0; font-size: 24px; color: var(--navy); }
  .count { color: var(--muted); font-size: 15px; }
  .count b { color: var(--open); }
  form, .item { background: var(--card); border: 1px solid var(--line); border-radius: 12px; }
  form { padding: 16px; display: grid; gap: 12px; margin-bottom: 24px; }
  label { display: grid; gap: 4px; font-weight: 600; font-size: 15px; }
  input, textarea, select {
    font: inherit; width: 100%; padding: 12px; direction: rtl; text-align: right;
    border: 1px solid var(--line); border-radius: 8px; background: #fff; color: var(--text);
  }
  textarea { min-height: 88px; resize: vertical; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  button {
    font: inherit; font-weight: 700; padding: 14px; border: 0; border-radius: 8px;
    background: var(--navy); color: #fff; cursor: pointer;
  }
  button:disabled { opacity: .4; cursor: not-allowed; }
  h2 { font-size: 18px; margin: 0 0 12px; }
  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  .item { padding: 12px 14px; }
  .meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 14px; color: var(--muted); margin-bottom: 4px; }
  .site { font-weight: 700; color: var(--text); }
  .badge { font-size: 13px; font-weight: 700; padding: 2px 10px; border-radius: 999px; margin-inline-start: auto; }
  .badge.open { color: var(--open); background: var(--open-bg); }
  .badge.closed { color: var(--closed); background: var(--closed-bg); }
  .finding { white-space: pre-wrap; word-break: break-word; }
  .empty { color: var(--muted); text-align: center; padding: 24px 0; }
  .warn { color: #a12; font-size: 14px; }
</style>
</head>
<body>
<main>
  <header>
    <h1>יומן ביקורי אתר</h1>
    <span class="count" id="count"></span>
  </header>

  <form id="form" novalidate>
    <div class="row">
      <label>תאריך
        <input type="date" id="date" required>
      </label>
      <label>סטטוס
        <select id="status">
          <option value="open">פתוח</option>
          <option value="closed">סגור</option>
        </select>
      </label>
    </div>
    <label>אתר
      <input type="text" id="site" list="sites" autocomplete="off" placeholder="שם האתר" required>
      <datalist id="sites"></datalist>
    </label>
    <label>ממצא
      <textarea id="finding" placeholder="מה ראית באתר" required></textarea>
    </label>
    <button type="submit" id="add" disabled>הוסף</button>
    <span class="warn" id="warn" hidden>שימי לב: הדפדפן לא מאפשר שמירה, והנתונים יימחקו ברענון.</span>
  </form>

  <h2>ממצאים</h2>
  <ul id="list"></ul>
</main>

<script>
(function () {
  var KEY = "site-visit-log.v1";
  var LAST_SITE = "site-visit-log.lastSite";
  var canStore = true;

  var form = document.getElementById("form");
  var dateEl = document.getElementById("date");
  var siteEl = document.getElementById("site");
  var findingEl = document.getElementById("finding");
  var statusEl = document.getElementById("status");
  var addBtn = document.getElementById("add");
  var listEl = document.getElementById("list");
  var countEl = document.getElementById("count");
  var sitesEl = document.getElementById("sites");

  function load() {
    try { return JSON.parse(localStorage.getItem(KEY)) || []; }
    catch (e) { canStore = false; return []; }
  }
  function save(items) {
    try { localStorage.setItem(KEY, JSON.stringify(items)); }
    catch (e) { canStore = false; }
  }
  function today() {
    var d = new Date();
    d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
    return d.toISOString().slice(0, 10);
  }
  function formatDate(iso) {
    var p = iso.split("-");
    return p[2] + "." + p[1] + "." + p[0];
  }
  function newId() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }

  var items = load();

  function render() {
    // פתוחים קודם, ובתוך כל קבוצה החדש ביותר למעלה
    var sorted = items.slice().sort(function (a, b) {
      if (a.status !== b.status) return a.status === "open" ? -1 : 1;
      if (a.date !== b.date) return a.date < b.date ? 1 : -1;
      return a.createdAt < b.createdAt ? 1 : -1;
    });

    listEl.innerHTML = "";
    if (!sorted.length) {
      var li = document.createElement("li");
      li.className = "empty";
      li.textContent = "עדיין אין ממצאים. מלאי את הטופס ולחצי \"הוסף\".";
      listEl.appendChild(li);
    }
    sorted.forEach(function (it) {
      var li = document.createElement("li");
      li.className = "item";

      var meta = document.createElement("div");
      meta.className = "meta";
      var date = document.createElement("span");
      date.textContent = formatDate(it.date);
      var site = document.createElement("span");
      site.className = "site";
      site.textContent = it.site;
      var badge = document.createElement("span");
      badge.className = "badge " + it.status;
      badge.textContent = it.status === "open" ? "פתוח" : "סגור";
      meta.append(date, site, badge);

      var finding = document.createElement("div");
      finding.className = "finding";
      finding.textContent = it.finding;

      li.append(meta, finding);
      listEl.appendChild(li);
    });

    var open = items.filter(function (i) { return i.status === "open"; }).length;
    countEl.innerHTML = "פתוחים: <b>" + open + "</b> מתוך " + items.length;

    var sites = Array.from(new Set(items.map(function (i) { return i.site; })));
    sitesEl.innerHTML = "";
    sites.forEach(function (s) {
      var o = document.createElement("option");
      o.value = s;
      sitesEl.appendChild(o);
    });

    document.getElementById("warn").hidden = canStore;
  }

  function validate() {
    addBtn.disabled = !(dateEl.value && siteEl.value.trim() && findingEl.value.trim());
  }

  form.addEventListener("input", validate);
  form.addEventListener("submit", function (e) {
    e.preventDefault();
    validate();
    if (addBtn.disabled) return;

    var site = siteEl.value.trim();
    items.push({
      id: newId(),
      date: dateEl.value,
      site: site,
      finding: findingEl.value.trim(),
      status: statusEl.value,
      createdAt: new Date().toISOString(),
      closedAt: statusEl.value === "closed" ? new Date().toISOString() : null
    });
    save(items);
    try { localStorage.setItem(LAST_SITE, site); } catch (err) {}

    // התאריך והאתר נשארים, כדי להוסיף עוד ממצא מאותו ביקור
    findingEl.value = "";
    statusEl.value = "open";
    validate();
    render();
    findingEl.focus();
  });

  dateEl.value = today();
  try { siteEl.value = localStorage.getItem(LAST_SITE) || ""; } catch (e) {}
  validate();
  render();
})();
</script>
</body>
</html>
